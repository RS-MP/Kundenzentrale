<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kundenzentrale Vorgänge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: App-Rahmen der Kundenzentrale (Seitennavigation links, Inhalt rechts).
   Vorgangsansicht: Schritte links (breit), Fakten und Verlauf rechts.
   Tokens = app.css (Variante A, Ruhig-Konzept: Farbe nur für Status). */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface2:#ECEEF1; --border:#DDE1E6; --border-strong:#C3CBD4;
  --ink:#18222C; --ink2:#42566A; --muted:#5F7080;
  --accent:#0B6875; --accent-strong:#084F5A; --accent-soft:#DCEEF1; --accent-line:#AFD8DE;
  --good:#1B7A44; --good-bg:#E0F1E7; --warn:#8A6100; --warn-bg:#F8EFD6; --crit:#B23730; --crit-bg:#FAE6E4;
  --knopf-text:#FFFFFF;
  --shadow:0 1px 2px rgba(20,30,40,.05),0 8px 24px rgba(20,30,40,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F141A; --surface:#161D25; --surface2:#1C242E; --border:#2B3543; --border-strong:#404E5F;
  --ink:#E9EEF3; --ink2:#B4C1CD; --muted:#7E8D9B;
  --accent:#56BDCB; --accent-strong:#8AD4DF; --accent-soft:#0F3138; --accent-line:#1D4A53;
  --good:#59C78F; --good-bg:#132A1E; --warn:#E3B75E; --warn-bg:#2C2312; --crit:#EB8078; --crit-bg:#341B18;
  --knopf-text:#08252B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#161D25; --surface2:#1C242E; --border:#2B3543; --border-strong:#404E5F;
  --ink:#E9EEF3; --ink2:#B4C1CD; --muted:#7E8D9B;
  --accent:#56BDCB; --accent-strong:#8AD4DF; --accent-soft:#0F3138; --accent-line:#1D4A53;
  --good:#59C78F; --good-bg:#132A1E; --warn:#E3B75E; --warn-bg:#2C2312; --crit:#EB8078; --crit-bg:#341B18;
  --knopf-text:#08252B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif}
a{color:var(--accent); text-decoration:none; cursor:pointer}
a:hover{text-decoration:underline}
h1{font-size:21px; font-weight:650; letter-spacing:-.01em; margin:0; text-wrap:balance}
h2{font-size:14px; font-weight:650; margin:0}
button{font:inherit; cursor:pointer; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
[hidden]{display:none!important}

/* App-Rahmen */
.app-rahmen{display:grid; grid-template-columns:214px minmax(0,1fr); min-height:100vh}
.seitennav{background:var(--surface); border-right:1px solid var(--border); position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; padding:14px 10px; padding-left:max(10px,env(safe-area-inset-left,0px))}
.marke{font-weight:700; font-size:15px; white-space:nowrap; padding:4px 12px 16px}
.marke .firma{color:var(--accent)}
.seitennav-links{display:flex; flex-direction:column; gap:2px}
.seitennav-links button{display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; border:0; background:none;
  color:var(--ink2); font-weight:500; position:relative; text-align:left; white-space:nowrap}
.seitennav-links button:hover{background:var(--surface2)}
.seitennav-links button.active{background:var(--accent-soft); color:var(--accent-strong); font-weight:600}
.seitennav-links button.active::before{content:""; position:absolute; left:-10px; top:6px; bottom:6px; width:3px; border-radius:2px; background:var(--accent)}
.abzeichen{margin-left:auto; min-width:19px; height:19px; border-radius:10px; background:var(--crit); color:var(--surface); font-size:11.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 5px}
.seitennav-fuss{margin-top:auto; padding:12px 6px 2px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px}
.seitennav-fuss label{font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px}
.thema-segment{display:inline-flex; align-self:center; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden}
.thema-segment button{border:0; background:var(--surface); color:var(--ink2); padding:4px 11px; font-size:12.5px; border-right:1px solid var(--border); white-space:nowrap}
.thema-segment button:last-child{border-right:0}
.thema-segment button.an{background:var(--accent); color:var(--knopf-text); font-weight:600}
.inhalt{max-width:1280px; margin:0 auto; width:100%; min-width:0;
  padding-block:24px 70px; padding-left:max(26px,env(safe-area-inset-left,0px)); padding-right:max(26px,env(safe-area-inset-right,0px))}
@media (max-width:820px){
  .app-rahmen{display:block}
  .seitennav{position:sticky; top:env(safe-area-inset-top,0px); height:auto; z-index:10; flex-direction:row; flex-wrap:wrap; align-items:center; gap:6px 10px;
    border-right:0; border-bottom:1px solid var(--border); padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
  .marke{padding:0}
  .seitennav-links{flex-direction:row; order:3; width:100%; overflow-x:auto}
  .seitennav-links button{padding:5px 10px}
  .seitennav-links button.active::before, .seitennav-links svg{display:none}
  .seitennav-fuss{margin:0 0 0 auto; border-top:0; padding:0; flex-direction:row; align-items:center}
  .seitennav-fuss label span{display:none}
  .inhalt{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:16px 70px}
}

/* Bausteine aus app.css */
.seitenkopf{display:flex; align-items:center; gap:10px 14px; margin-bottom:16px; flex-wrap:wrap}
.seitenkopf .rechts{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.karte{background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); overflow:hidden; min-width:0}
.karte + .karte{margin-top:16px}
.karte-kopf{padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px 12px; flex-wrap:wrap}
.karte-kopf .zusatz{color:var(--muted); font-size:13px}
.karte-kopf .rechts{margin-left:auto}
.karte-koerper{padding:14px 16px}
.karte-fuss{padding:10px 16px; border-top:1px solid var(--border); color:var(--muted); font-size:12.5px; background:var(--surface2)}
.tabelle-wrap{overflow-x:auto}
table.liste{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
table.liste th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:9px 14px; border-bottom:1px solid var(--border); background:var(--surface2); white-space:nowrap}
table.liste td{padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:top}
table.liste tr:last-child td{border-bottom:0}
table.liste tbody tr.klickbar{cursor:pointer}
table.liste tbody tr.klickbar:hover{background:var(--accent-soft)}
td .haupt{font-weight:600}
td .neben, .neben{color:var(--muted); font-size:12.5px}
.pill{display:inline-block; padding:0 8px; border-radius:999px; font-size:12px; font-weight:500; border:1px solid var(--border-strong); color:var(--ink2); white-space:nowrap; line-height:19px}
.status{display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-weight:500}
.status::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0}
.status.gut::before{background:var(--good)} .status.warnung::before{background:var(--warn)}
.status.kritisch::before{background:var(--crit)} .status.akzent::before{background:var(--accent)}
.status.kritisch{color:var(--crit)}
.krittext{color:var(--crit)} .warntext{color:var(--warn)}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{font-size:13px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink2); border-radius:999px; padding:3px 12px}
.chip:hover{border-color:var(--accent)}
.chip.aktiv{background:var(--ink); border-color:var(--ink); color:var(--surface)}
.knopf{background:var(--accent); color:var(--knopf-text); border:0; border-radius:7px; padding:7px 14px; font-weight:600; white-space:nowrap}
.knopf:hover{background:var(--accent-strong)}
.knopf.sekundaer{background:var(--surface2); color:var(--ink2); border:1px solid var(--border-strong); font-weight:500}
.knopf.sekundaer:hover{background:var(--border)}
.knopf.klein{padding:3px 10px; font-size:12.5px}
.knopf:disabled{opacity:.45; cursor:default}
.textknopf{background:none; border:0; color:var(--accent); padding:2px 0; font-size:13px}
.textknopf:hover{text-decoration:underline}
.seg{display:inline-flex; gap:3px; background:var(--surface2); padding:3px; border-radius:9px}
.seg button{border:0; background:transparent; padding:4px 13px; border-radius:7px; color:var(--ink2); font-size:13px}
.seg button.an{background:var(--surface); color:var(--ink); box-shadow:var(--shadow); font-weight:600}
input[type=text], input[type=date], input[type=number], select, textarea{font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--border-strong); border-radius:7px; padding:6px 9px; min-width:0}
input:focus, select:focus, textarea:focus{outline:2px solid var(--accent-line); border-color:var(--accent)}
input:disabled, select:disabled{background:var(--surface2); color:var(--muted)}
.fehler{color:var(--crit); font-size:12.5px}

/* Hinweis-Kasten (Mockup) */
.mock-hinweis{font-size:13px; color:var(--ink2); border:1px dashed var(--border-strong); border-radius:10px; padding:10px 14px; margin-bottom:16px; background:var(--surface)}
.mock-hinweis summary{cursor:pointer; font-weight:600; color:var(--ink)}
.mock-hinweis ul{margin:6px 0 2px; padding-left:18px}

/* KPI-Zeile */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; margin-bottom:14px}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 14px; text-align:left; min-width:0}
.kpi:hover{border-color:var(--accent)}
.kpi.an{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.kpi .wert{font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:8px; color:var(--ink)}
.kpi .wert.status::before{width:9px; height:9px}
.kpi .label{color:var(--muted); font-size:12.5px}
.filterleiste{display:flex; gap:10px 14px; flex-wrap:wrap; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border)}
.umschalter{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink2); cursor:pointer; user-select:none}
.umschalter input{accent-color:var(--accent)}

/* Fortschritt */
.fortschritt{display:flex; align-items:center; gap:8px; white-space:nowrap}
.balken{display:flex; gap:3px}
.balken i{display:block; width:13px; height:7px; border-radius:2px; background:var(--surface2); border:1px solid var(--border-strong)}
.balken i.erl{background:var(--good); border-color:var(--good)}
.balken i.akt{background:var(--accent-line); border-color:var(--accent)}
.balken i.wartet{background:var(--warn); border-color:var(--warn)}
.balken i.ueber{background:var(--crit); border-color:var(--crit)}
.balken i.gesp{background:transparent; border-style:dashed}
.fortschritt .zahl{color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums}
.naechst .titel{font-weight:500}
.naechst .weitere{color:var(--muted); font-size:12px}

/* Vorgangsansicht */
.zurueck{display:inline-block; margin-bottom:10px; font-size:13px}
.vorgang-kopf{background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:14px 18px; margin-bottom:16px;
  display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center}
.vorgang-kopf .titelblock{min-width:0; flex:1 1 320px}
.vorgang-kopf .meta{color:var(--ink2); margin-top:3px}
.vorgang-kopf .meta .trenn{color:var(--border-strong); margin:0 6px}
.akte{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:980px){ .akte{grid-template-columns:minmax(0,1fr)} }
.schritt{display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:4px 12px; padding:13px 16px; border-bottom:1px solid var(--border)}
.schritt:last-child{border-bottom:0}
.schritt .nr{width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border-strong); display:flex; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:600; color:var(--ink2); font-variant-numeric:tabular-nums}
.schritt.erledigt .nr{background:var(--good); border-color:var(--good); color:var(--surface)}
.schritt.ueber .nr{border-color:var(--crit); color:var(--crit)}
.schritt.wartet .nr{border-color:var(--warn); color:var(--warn)}
.schritt.aktiv .nr{border-color:var(--accent); color:var(--accent)}
.schritt.gesperrt .nr{border-style:dashed}
.schritt.gesperrt .s-titel, .schritt.gesperrt .s-meta{color:var(--muted)}
.schritt.erledigt .s-titel{color:var(--ink2)}
.schritt.entfaellt{opacity:.6}
.schritt.entfaellt .s-titel{text-decoration:line-through; font-weight:400}
.s-haupt{min-width:0}
.s-titel{font-weight:600; padding-top:2px}
.s-meta{color:var(--ink2); font-size:13px; display:flex; flex-wrap:wrap; gap:2px 8px; align-items:center; margin-top:2px}
.s-meta .trenn{color:var(--border-strong)}
.s-auto{font-size:12.5px; color:var(--muted); margin-top:5px}
.s-auto::before{content:"↻"; color:var(--accent); font-weight:700; margin-right:6px}
.s-auto .textknopf{font-size:12.5px; margin-left:8px}
.s-notiz{font-size:13px; color:var(--ink2); margin-top:6px; padding:5px 10px; background:var(--surface2); border-radius:7px}
.s-notiz .wer{color:var(--muted); font-size:12px; margin-left:6px}
.s-rechts{padding-top:2px}
.s-akt{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.s-form{grid-column:2 / -1; margin-top:8px; padding:10px 12px; border:1px solid var(--accent-line); border-radius:8px; background:var(--accent-soft);
  display:flex; flex-wrap:wrap; gap:8px 10px; align-items:flex-end}
.s-form label{display:flex; flex-direction:column; gap:3px; font-size:12.5px; color:var(--ink2); flex:1 1 180px}
.s-form textarea{min-height:56px; resize:vertical}
.s-form .fehler{flex-basis:100%}
@media (max-width:620px){
  .schritt{grid-template-columns:30px minmax(0,1fr)}
  .schritt .nr{grid-row:1 / span 2}
  .s-rechts{grid-column:2; grid-row:1; padding-top:0}
  .s-haupt{grid-column:2; grid-row:2}
  .s-form{grid-column:2}
}
.fakt{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px dashed var(--border); font-size:13.5px}
.fakt:last-of-type{border-bottom:0}
.fakt .l{color:var(--muted)} .fakt .r{text-align:right; min-width:0; overflow-wrap:anywhere}
.uebergang{font-size:12.5px; color:var(--ink2); background:var(--surface2); border-radius:7px; padding:8px 10px; margin-top:10px}
.verlauf{list-style:none; margin:0; padding:0}
.verlauf li{padding:8px 16px; border-bottom:1px solid var(--border); font-size:13px; display:grid; grid-template-columns:46px minmax(0,1fr); gap:8px}
.verlauf li:last-child{border-bottom:0}
.verlauf .wann{color:var(--muted); font-variant-numeric:tabular-nums}
.verlauf .wer{color:var(--muted); font-size:12px}
.verlauf li.system .text{color:var(--ink2)}

/* Anlegen */
.anlegen{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:980px){ .anlegen{grid-template-columns:minmax(0,1fr)} }
.feld{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--ink2)}
.feld .hilfe{color:var(--muted); font-size:12px}
.feldgruppe{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px}
.abschnitt{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; margin:4px 0 8px}
.typwahl{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin-bottom:16px}
.typkarte{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--border-strong); border-radius:9px; padding:10px 12px; cursor:pointer; background:var(--surface)}
.typkarte:hover{border-color:var(--accent)}
.typkarte.an{border-color:var(--accent); background:var(--accent-soft)}
.typkarte input{margin-top:3px; accent-color:var(--accent)}
.typkarte .n{font-weight:600}
.typkarte .b{font-size:12.5px; color:var(--muted)}
.typkarte .vorschlag{font-size:10.5px; font-weight:600; letter-spacing:.05em; color:var(--accent); margin-left:6px}
.bedingungen{display:flex; flex-direction:column; gap:6px; margin-bottom:16px}
.bedingungen label{display:flex; gap:8px; align-items:center; font-size:13.5px}
.bedingungen input{accent-color:var(--accent)}
.odoo-band{display:flex; gap:4px 14px; flex-wrap:wrap; align-items:baseline; padding:9px 12px; border-radius:8px; background:var(--surface2); margin-bottom:16px; font-size:13px}
.vorschau-schritt{display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:2px 10px; padding:9px 16px; border-bottom:1px solid var(--border)}
.vorschau-schritt:last-of-type{border-bottom:0}
.vorschau-schritt .x{grid-column:3; grid-row:1 / span 2; align-self:center}
.vorschau-schritt .nr{color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums}
.vorschau-schritt .t{font-weight:500}
.vorschau-schritt .m{grid-column:2; font-size:12.5px; color:var(--muted)}
.vorschau-schritt.weg .t{text-decoration:line-through; color:var(--muted); font-weight:400}

/* Vorlagen */
.vorlagen-liste{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px; margin-bottom:16px}
.vorlagen-liste button{display:block; text-align:left; border:1px solid var(--border-strong); border-radius:9px; background:var(--surface); padding:9px 14px}
.vorlagen-liste button:hover{border-color:var(--accent)}
.vorlagen-liste button.an{background:var(--accent-soft); border-color:var(--accent)}
.vorlagen-liste .n{font-weight:600; display:block}
.vorlagen-liste .b{font-size:12px; color:var(--muted)}
table.editor{border-collapse:collapse; width:100%; min-width:940px; font-size:13px}
table.editor th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:8px 8px; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap}
table.editor td{padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:middle}
table.editor tr:last-child td{border-bottom:0}
table.editor input[type=text]{width:100%}
table.editor td.titel{min-width:250px}
table.editor td.mittel{min-width:120px}
table.editor input[type=number]{width:62px}
table.editor select{max-width:190px}
table.editor .nr{color:var(--muted); font-weight:600; width:28px}
.entfernen{border:0; background:none; color:var(--muted); font-size:16px; padding:2px 6px; border-radius:5px}
.entfernen:hover:not(:disabled){color:var(--crit); background:var(--crit-bg)}
.entfernen:disabled{opacity:.4; cursor:default}
.pflege{font-size:12.5px; color:var(--ink2); padding:10px 16px; border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; gap:4px 14px}
.pflege.gesperrt{background:var(--warn-bg); color:var(--warn)}

/* Hinweis am Vorgang, manuelle Schritte, Schritt hinzufügen */
.vg-hinweis{flex-basis:100%; display:flex; gap:6px 10px; align-items:flex-start; flex-wrap:wrap; background:var(--warn-bg); color:var(--warn);
  border:1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius:8px; padding:8px 12px; font-weight:600}
.vg-hinweis .txt{flex:1 1 240px; min-width:0; overflow-wrap:anywhere}
.vg-hinweis .textknopf{font-weight:500}
.vg-hinweis.bearbeiten{background:var(--surface2); color:var(--ink2); border-color:var(--border); font-weight:400; flex-direction:column; align-items:stretch}
.vg-hinweis.bearbeiten label{font-size:12.5px}
textarea.hinweis-feld{width:100%; min-height:46px; resize:vertical}
.hinweis-zeile{margin-top:4px; font-size:12.5px; font-weight:600; color:var(--warn); display:flex; gap:5px; max-width:300px}
.hinweis-zeile span{overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.manuell{font-size:11px; font-weight:600; letter-spacing:.03em; color:var(--accent); border:1px dashed var(--accent); border-radius:4px; padding:0 5px; line-height:17px; white-space:nowrap}
.textknopf.leise{color:var(--muted); font-size:12.5px}
.textknopf.leise:hover{color:var(--crit)}
.neu-schritt{padding:12px 16px; border-top:1px solid var(--border); background:var(--accent-soft); display:flex; flex-wrap:wrap; gap:8px 10px; align-items:flex-end}
.neu-schritt label{display:flex; flex-direction:column; gap:3px; font-size:12.5px; color:var(--ink2)}
.neu-schritt label.breit{flex:1 1 220px}
.neu-schritt input[type=number]{width:72px}
.neu-schritt .fehler{flex-basis:100%}
.karten-aktion{padding:10px 16px; border-top:1px solid var(--border)}
.vorlagen-liste button.aus{opacity:.6}
.vorlagen-liste button.neu{border-style:dashed; color:var(--accent); font-weight:600}

/* Toast */
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:30;
  background:var(--ink); color:var(--surface); border-radius:9px; padding:9px 16px; font-size:13.5px; box-shadow:var(--shadow);
  display:flex; gap:14px; align-items:center; width:max-content; max-width:calc(100% - 32px)}
.toast button{background:none; border:0; color:var(--accent-line); font-weight:600; padding:0}
.leer{padding:26px 16px; text-align:center; color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .toast{animation:rein .18s ease-out} @keyframes rein{from{opacity:0}} }

<script>
/* ===== Stammdaten (Beispiele) ===== */

    ap: 'Herr Peters (GF)', positionen: ['Tier STARTER'],
    schritte: baue('neu', [
      { status: 'erledigt', zust: 'weiss', fristDat: d(11,10), erledigtAm: d(9,10), erledigtVon: 'weiss', wert: 'PETERS-01' },
      { status: 'erledigt', zust: 'stauch', fristDat: d(10,10), erledigtAm: d(9,10), erledigtVon: 'stauch' },

  { odoo: 'S01240', kunde: 'Nordbau GmbH', bestaetigt: d(27,10), von: 'stauch', ap: 'Herr Albers (IT-Leitung)', positionen: ['Beratung (4 Stunden)'], vorlage: 'stunden' },
  { odoo: 'S01239', kunde: 'Kanzlei Seidel & Partner', bestaetigt: d(26,10), von: 'stauch', ap: 'Frau Dr. Seidel (Partnerin)', positionen: ['Zusatzbenutzer (5)'], vorlage: 'direkt' },
];
const NICHT_ANGEZEIGT = { mitRechnung: 17, abo: 15 };

/* ===== Ableitungen ===== */
const fertigOderWeg = s => s.status === 'erledigt' || s.status === 'entfaellt';

const ueberfaellig = (v, s) => aktiv(v, s) && s.status !== 'wartet' && s.fristDat && s.fristDat < HEUTE;
function vStatus(v) {
  const rel = v.schritte.filter(s => s.status !== 'entfaellt');
  if (rel.every(s => s.status === 'erledigt')) return 'fertig';
  if (rel.some(s => ueberfaellig(v, s))) return 'haengt';
  const akt = rel.filter(s => aktiv(v, s));
  if (akt.length && akt.every(s => s.status === 'wartet')) return 'wartet';
  if (!rel.some(s => s.status !== 'offen')) return 'neu';
  return 'laeuft';
}

  return v.schritte.map((s, i) => ({ s, i })).filter(x => aktiv(v, x.s))

}

}
function statusHtml(v) { const [t, c] = VST[vStatus(v)]; return `<span class="status ${c}">${t}</span>`; }

function schrittHtml(v, s, i) {
  const nr = i + 1;
  if (s.status === 'entfaellt') return `<div class="schritt entfaellt"><div class="nr">${nr}</div><div class="s-haupt">
    <div class="s-titel">${esc(s.t)}</div><div class="s-meta">${s.grund === 'entfernt' ? 'Von Hand entfernt, nur in diesem Vorgang' : `Entfällt, weil „${esc(s.bed)}" nicht zutrifft`}</div></div></div>`;
  const gs = gesperrt(v, s), ue = ueberfaellig(v, s), erl = s.status === 'erledigt';
  let st, cls, zcls;
  if (erl) { st = `Erledigt ${fmt(s.erledigtAm)}`; cls = 'gut'; zcls = 'erledigt'; }
  else if (gs) { st = `Wartet auf Schritt ${s.wartet + 1}`; cls = ''; zcls = 'gesperrt'; }
  else if (s.status === 'wartet') { st = 'Wartet auf Kunden'; cls = 'warnung'; zcls = 'wartet'; }
  else if (ue) { st = 'Überfällig'; cls = 'kritisch'; zcls = 'ueber'; }
  else if (s.status === 'inarbeit') { st = 'In Arbeit'; cls = 'akzent'; zcls = 'aktiv'; }
  else { st = s.zust ? 'Offen' : 'Offen im Pool'; cls = ''; zcls = 'aktiv'; }

  const meta = [`<span class="pill">${BEREICHE[s.b]}</span>`];
  if (s.manuell) meta.push('<span class="manuell" title="Nur in diesem Vorgang, nicht aus der Vorlage">von Hand</span>');
  if (erl) meta.push(`von ${name(s.erledigtVon)}`);
  else meta.push(s.zust ? name(s.zust) : `Pool ${BEREICHE[s.b]}`);
  if (gs) meta.push(`Frist ${s.frist} Tage nach Schritt ${s.wartet + 1}`);
  else if (!erl && s.status === 'wartet') meta.push(`<span class="warntext">Wiedervorlage ${fmt(s.wv)}</span>`);
  else if (!erl && s.fristDat) meta.push(ue ? `<span class="krittext">Frist ${fmt(s.fristDat)}, ${tageZwischen(s.fristDat, HEUTE)} Tage drüber</span>` : `Frist ${fmt(s.fristDat)}`);
  if (s.pflicht && s.wert) meta.push(`${esc(s.pflicht)}: <b>${esc(s.wert)}</b>`);
  if (!erl && s.info !== 'keine' && gs) meta.push(`Hinweis per ${INFO[s.info]}, sobald dran`);

  let akt = '';
  if (!erl) {
    const k = [];
    if (aktiv(v, s)) {
    if (!s.zust) k.push(`<button class="knopf klein" data-akt="uebernehmen" data-i="${i}">Übernehmen</button>`);
    if (s.status === 'wartet') k.push(`<button class="knopf sekundaer klein" data-akt="antwort" data-i="${i}">Kunde hat geantwortet</button>`);

      k.push(`<button class="knopf ${s.zust ? '' : 'sekundaer'} klein" data-akt="erledigt-form" data-i="${i}">Erledigt</button>`);
      k.push(`<button class="knopf sekundaer klein" data-akt="wartet-form" data-i="${i}">Wartet auf Kunden</button>`);
    }
    k.push(`<button class="knopf sekundaer klein" data-akt="notiz-form" data-i="${i}">Notiz</button>`);
    }
    k.push(`<button class="textknopf leise" data-akt="vg-entfernen" data-i="${i}" title="Nur in diesem Vorgang entfernen">Entfernen</button>`);
    akt = `<div class="s-akt">${k.join('')}</div>`;

  const fehler = formFehler ? `<div class="fehler">${esc(formFehler)}</div>` : '';
  const abbr = `<button class="knopf sekundaer klein" data-akt="abbrechen">Abbrechen</button>`;

      <label for="f-wert">${esc(s.pflicht)} (Pflichtfeld, landet in der Kundenakte)<input type="text" id="f-wert" value="${esc(s.wert)}" autocomplete="off"></label>

/* Aktionen auf Schritten */
function protokoll(v, wer, text) { v.verlauf.push({ am: HEUTE, wer, text, n: seq++ }); }
function erledigen(v, i, wer) {
  const s = v.schritte[i];
  s.status = 'erledigt'; s.erledigtAm = HEUTE; s.erledigtVon = wer; if (!s.zust && wer !== 'system') s.zust = wer;
  protokoll(v, wer, `Schritt ${i + 1} erledigt: ${s.t}${s.pflicht && s.wert ? ` (${s.pflicht} ${s.wert})` : ''}`);
  const frei = [];
  v.schritte.forEach((t, j) => {
    if (t.wartet === i && t.status !== 'entfaellt' && t.status !== 'erledigt') {
      t.fristDat = plus(HEUTE, t.frist);
      const an = t.zust ? name(t.zust) : BEREICHE[t.b];
      protokoll(v, 'system', `Schritt ${j + 1} ist jetzt dran: ${t.zust ? name(t.zust) : 'Pool ' + BEREICHE[t.b]}, Frist ${fmt(t.fristDat)}`
        + (t.info !== 'keine' ? `. Hinweis per ${INFO[t.info]} an ${an}` : ''));
      frei.push(`Schritt ${j + 1} liegt jetzt bei ${an}`);
    }
  });
  if (vStatus(v) === 'fertig') { protokoll(v, 'system', 'Vorgang abgeschlossen'); toast('Alle Schritte erledigt, Vorgang abgeschlossen.'); }
  else toast(frei.length ? `Schritt ${i + 1} erledigt. ` + frei.join(', ') + '.' : `Schritt ${i + 1} erledigt.`);
}

// Schritt im laufenden Vorgang entfernen: wer auf ihn wartet, hängt sich an seinen Vorgänger
function entfernen(v, i) {
  const s = v.schritte[i];
  s.status = 'entfaellt'; s.grund = 'entfernt';
  v.schritte.forEach(t => {
    if (t.wartet !== i) return;
    t.wartet = s.wartet;
    if (!t.fristDat && (t.wartet == null || fertigOderWeg(v.schritte[t.wartet]))) t.fristDat = plus(HEUTE, t.frist);
  });
}

/* ===== Ansicht: Anlegen ===== */
function neuerEntwurf(x) {
  const erste = VORLAGEN.find(v => v.aktiv).id;
  const vor = x && vorlage(x.vorlage)?.aktiv ? x.vorlage : null;
  entwurf = { kunde: x?.kunde || '', odoo: x?.odoo || '', vorlage: vor || erste, vorschlag: vor,
    start: isoDatum(HEUTE), bed: {}, ap: x?.ap || '', positionen: x?.positionen || [], aus: x || null, fehler: {},
    hinweis: '', schritte: [], neuForm: false };
  bedDefaults(); entwurfSchritte();
}
// Schritte dieses Vorgangs = Kopie der Vorlage; manuell hinzugefügte bleiben beim Typwechsel erhalten
function entwurfSchritte() {
  const manuelle = entwurf.schritte.filter(s => s.manuell).map(s => ({ ...s, wartet: null }));
  entwurf.schritte = [...vorlage(entwurf.vorlage).schritte.map(s => ({ ...s, entfernt: false })), ...manuelle];
}
function leseNeu() {
  const t = $('#n-t').value.trim(), w = $('#n-wartet').value;
  if (!t) { formFehler = 'Bitte einen Namen für den Schritt eintragen.'; return null; }
  formFehler = '';
  return { t, b: $('#n-b').value, frist: Math.max(0, Number($('#n-frist').value) || 0), wartet: w === '' ? null : Number(w) };
}
function neuSchrittHtml(schritte, offen, praefix) {
  if (!offen) return `<div class="karten-aktion"><button class="knopf sekundaer klein" data-akt="${praefix}-neu-form">Schritt von Hand hinzufügen</button></div>`;
  const wahl = schritte.map((s, k) => (s.status === 'entfaellt' || s.status === 'erledigt' || s.entfernt || s.weg) ? '' : `<option value="${k}">Schritt ${k + 1}</option>`).join('');
  return `<div class="neu-schritt">
    <label class="breit" for="n-t">Neuer Schritt<input type="text" id="n-t" placeholder="z. B. Altdaten aus Excel übernehmen" autocomplete="off"></label>
    <label for="n-b">Bereich<select id="n-b">${Object.entries(BEREICHE).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></label>

    ${formFehler ? `<div class="fehler">${esc(formFehler)}</div>` : ''}
  </div>`;
}
function bedDefaults() {
  entwurf.bed = {};

    entwurf.bed[b] = b === 'Schulung bestellt' ? entwurf.positionen.some(p => /Schulung/i.test(p)) : true;
  });
}
const bedingungen = () => [...new Set(vorlage(entwurf.vorlage).schritte.map(s => s.bed).filter(Boolean))];

function renderAnlegen() {
  const e = entwurf;
  inhalt.innerHTML = `

}
function renderVorschau() {
  const e = entwurf, vl = vorlage(e.vorlage), start = ausIso(e.start) || HEUTE;
  const sch = e.schritte.map(s => ({ ...s, weg: !!(s.bed && !e.bed[s.bed]) }));
  const raus = s => s.weg || s.entfernt;
  const vorg = k => { while (k != null && raus(sch[k])) k = sch[k].wartet; return k; };
  $('#vorschau').innerHTML = sch.map((s, i) => {
    let m, x = '';
    if (s.weg) m = `entfällt, weil „${esc(s.bed)}" nicht angehakt ist`;
    else if (s.entfernt) {
      m = 'von Hand entfernt, nur in diesem Vorgang';
      x = `<button class="textknopf" data-akt="e-zurueck" data-i="${i}">Zurückholen</button>`;
    } else {
      const w = vorg(s.wartet);
      const fr = w != null ? `startet nach Schritt ${w + 1}, dann ${s.frist} Tage Frist` : `Frist ${fmt(plus(start, s.frist))}`;
      m = `${BEREICHE[s.b]} · ${fr}${s.info !== 'keine' ? ` · Hinweis per ${INFO[s.info]}` : ''}${s.pflicht ? ` · Pflichtfeld ${esc(s.pflicht)}` : ''}${s.auto ? ' · hakt sich selbst ab' : ''}`;
      x = `<button class="entfernen" data-akt="e-entfernen" data-i="${i}" title="Nur in diesem Vorgang entfernen" aria-label="Schritt ${i + 1} entfernen">×</button>`;
    }
    return `<div class="vorschau-schritt ${raus(s) ? 'weg' : ''}"><span class="nr">${i + 1}</span>
      <span class="t">${esc(s.t)}${s.manuell ? ' <span class="manuell">von Hand</span>' : ''}</span>${x ? `<span class="x">${x}</span>` : ''}<span class="m">${m}</span></div>`;
  }).join('') + neuSchrittHtml(sch, e.neuForm, 'e');
  const n = sch.filter(s => !raus(s)).length;
  $('#vs-zahl').textContent = `${n} Schritt${n === 1 ? '' : 'e'}, Grundlage „${vl.name}", Stand ${vl.stand}`;
  if (e.neuForm) $('#n-t')?.focus();
}
function anlegen() {
  const e = entwurf; e.fehler = {};
  e.kunde = e.kunde.trim(); e.odoo = e.odoo.trim().toUpperCase();
  if (!e.kunde) e.fehler.kunde = 'Bitte einen Kunden eintragen.';
  if (e.odoo && !/^S\d{5}$/.test(e.odoo)) e.fehler.odoo = 'Die Odoo-Auftragsnummer hat die Form S01234.';
  else if (e.odoo && VORGAENGE.some(v => v.odoo === e.odoo)) e.fehler.odoo = `Zu ${e.odoo} gibt es schon einen Vorgang.`;
  if (Object.keys(e.fehler).length) return renderAnlegen();
  const vl = vorlage(e.vorlage), start = ausIso(e.start) || HEUTE;
  const id = Math.max(...VORGAENGE.map(v => v.id)) + 1;
  const schritte = e.schritte.map(({ entfernt, ...s }) => {
    const weg = !!(s.bed && !e.bed[s.bed]);
    return { ...s, status: weg || entfernt ? 'entfaellt' : 'offen', grund: entfernt ? 'entfernt' : weg ? 'bedingung' : null,
      zust: null, fristDat: null, erledigtAm: null, erledigtVon: null, wv: null, wert: '', notiz: null };
  });
  // Wartet ein Schritt auf einen entfallenen, hängt er sich an dessen Vorgänger
  schritte.forEach(s => { while (s.wartet != null && schritte[s.wartet].status === 'entfaellt') s.wartet = schritte[s.wartet].wartet; });
  schritte.forEach(s => { if (s.status !== 'entfaellt' && s.wartet == null) s.fristDat = plus(start, s.frist); });
  const v = { id, kunde: e.kunde, typ: vl.id, stand: vl.stand, odoo: e.odoo, bestaetigt: e.aus?.bestaetigt || null, start, von: ich,
    ap: e.ap, positionen: e.positionen, schritte, verlauf: [], hinweis: e.hinweis.trim() };
  protokoll(v, ich, `Vorgang angelegt aus Vorlage „${vl.name}" (Stand ${vl.stand})`);
  if (v.hinweis) protokoll(v, ich, `Hinweis gesetzt: ${v.hinweis}`);
  schritte.forEach((s, i) => {
    if (s.grund === 'entfernt') protokoll(v, ich, `Schritt ${i + 1} von Hand entfernt: ${s.t}`);
    if (s.manuell) protokoll(v, ich, `Schritt ${i + 1} von Hand hinzugefügt: ${s.t}`);
  });
  schritte.forEach((s, i) => { if (s.status !== 'entfaellt' && s.wartet == null && s.info !== 'keine')
    protokoll(v, 'system', `Hinweis per ${INFO[s.info]} an ${BEREICHE[s.b]}: Schritt ${i + 1} liegt im Pool`); });
  VORGAENGE.push(v);
  if (!KUNDEN.includes(e.kunde)) KUNDEN.push(e.kunde);
  VORSCHLAEGE = VORSCHLAEGE.filter(x => x.odoo !== e.odoo);
  const pools = [...new Set(schritte.filter(s => s.status !== 'entfaellt' && s.wartet == null).map(s => BEREICHE[s.b]))];
  zeige('vorgang', id);
  toast(`Vorgang angelegt. Die ersten Schritte liegen in den Pools ${pools.join(', ')}.`);
}

/* ===== Rendern, Navigation, Ereignisse ===== */
function render() {
  renderNav();
  if (ansicht === 'vorgang') renderVorgang();
  else if (ansicht === 'anlegen') renderAnlegen();
  else if (ansicht === 'vorlagen') renderVorlagen();
  else renderUebersicht();
}
function zeige(a, id) {
  ansicht = a; aktId = id ?? null; formular = null; formFehler = '';
  const h = a === 'vorgang' ? 'vorgang-' + id : a;
  try { history.replaceState(null, '', '#' + h); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
let toastTimer;
function toast(text, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(text)}</span>${undo ? '<button id="undo">Rückgängig</button>' : ''}`;
  t.hidden = false;
  if (undo) $('#undo').onclick = () => { undo(); t.hidden = true; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 6000 : 4000);
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-nav],[data-thema],[data-ansicht],[data-akt],[data-bereich],[data-kpi],[data-vorgang],[data-vorlage]');
  if (!el || el.disabled) return;
  if (el.tagName === 'A') ev.preventDefault();
  if (el.dataset.nav) { if (el.dataset.nav === 'vorgaenge') zeige('uebersicht'); else toast('Im Mockup ist nur der Bereich Vorgänge ausgearbeitet.'); return; }
  if (el.dataset.thema !== undefined) {
    thema = el.dataset.thema || null;
    if (thema) document.documentElement.dataset.theme = thema; else delete document.documentElement.dataset.theme;
    try { thema ? localStorage.setItem('kz-thema', thema) : localStorage.removeItem('kz-thema'); } catch (e) {}
    renderNav(); return;
  }
  if (el.dataset.ansicht) { zeige(el.dataset.ansicht); return; }
  if (el.dataset.bereich) { fBereich = el.dataset.bereich; render(); return; }
  if (el.dataset.kpi !== undefined) { const k = el.dataset.kpi || null; fStatus = fStatus === k ? null : k; render(); return; }
  if (el.dataset.vorgang) { zeige('vorgang', Number(el.dataset.vorgang)); return; }
  if (el.dataset.vorlage) { aktVorlage = el.dataset.vorlage; render(); return; }

  const a = el.dataset.akt, i = Number(el.dataset.i);
  const v = VORGAENGE.find(x => x.id === aktId);
  switch (a) {
    case 'neu': neuerEntwurf(null); zeige('anlegen'); break;
    case 'aus-odoo': neuerEntwurf(VORSCHLAEGE.find(x => x.odoo === el.dataset.odoo)); zeige('anlegen'); break;
    case 'ausblenden': {
      const nr = el.dataset.odoo; ausgeblendet.push(nr); render();
      toast(`${nr} ausgeblendet.`, () => { ausgeblendet = ausgeblendet.filter(x => x !== nr); render(); });
      break; }
    case 'zu-odoo': $('#odoo')?.scrollIntoView({ block: 'start' }); break;
    case 'status-weg': fStatus = null; render(); break;
    case 'anlegen': anlegen(); break;
    case 'akte': toast('Springt in die Kundenakte, gefiltert auf diesen Strang.'); break;
    case 'uebernehmen': {
      const s = v.schritte[i]; s.zust = ich; s.status = 'inarbeit';
      protokoll(v, ich, `Schritt ${i + 1} übernommen`); toast(`${name(ich)} hat Schritt ${i + 1} übernommen.`); render(); break; }
    case 'antwort': {
      const s = v.schritte[i]; s.status = 'inarbeit'; s.wv = null; s.fristDat = plus(HEUTE, 2);
      protokoll(v, ich, `Schritt ${i + 1}: Kunde hat geantwortet, weiter in Arbeit`); render(); break; }
    case 'erledigt-form':
      if (!v.schritte[i].pflicht) { formular = null; erledigen(v, i, ich); render(); }
      else { formular = { i, art: 'erledigt' }; formFehler = ''; render(); }
      break;
    case 'wartet-form': formular = { i, art: 'wartet' }; formFehler = ''; render(); break;
    case 'notiz-form': formular = { i, art: 'notiz' }; formFehler = ''; render(); break;
    case 'abbrechen': formular = null; formFehler = ''; render(); break;
    case 'erledigt': {
      const s = v.schritte[i], wert = $('#f-wert').value.trim(), notiz = $('#f-notiz').value.trim();
      if (!wert) { formFehler = `Bitte ${s.pflicht} eintragen. Kollegen finden sie danach in der Kundenakte.`; render(); return; }
      s.wert = wert; if (notiz) s.notiz = N(notiz, ich, HEUTE);
      formular = null; formFehler = ''; erledigen(v, i, ich); render(); break; }
    case 'wartet': {
      const s = v.schritte[i], wv = ausIso($('#f-wv').value), grund = $('#f-notiz').value.trim();
      if (!wv || wv <= HEUTE) { formFehler = 'Die Wiedervorlage muss nach heute liegen.'; render(); return; }
      s.status = 'wartet'; s.wv = wv; s.fristDat = wv; if (!s.zust) s.zust = ich;
      if (grund) s.notiz = N(grund, ich, HEUTE);
      protokoll(v, ich, `Schritt ${i + 1} wartet auf Kunden bis ${fmt(wv)}${grund ? ': ' + grund : ''}`);
      formular = null; formFehler = ''; toast(`Wiedervorlage am ${fmt(wv)}. Bis dahin keine rote Ampel.`); render(); break; }
    case 'notiz': {
      const text = $('#f-notiz').value.trim();
      if (!text) { formFehler = 'Die Notiz ist leer.'; render(); return; }
      v.schritte[i].notiz = N(text, ich, HEUTE); protokoll(v, ich, `Schritt ${i + 1}: ${text}`);
      formular = null; formFehler = ''; render(); break; }
    case 'odoo-demo': {
      const s = v.schritte[i]; s.notiz = N(`Rechnung RE/2026/04${30 + v.id} zum Auftrag gefunden`, 'system', HEUTE);
      erledigen(v, i, 'system'); render(); break; }
    /* Hinweis und Anpassungen am laufenden Vorgang */
    case 'hinweis-form': formular = { i: -2, art: 'hinweis' }; formFehler = ''; render(); break;
    case 'hinweis-speichern': {
      const t = $('#f-hinweis').value.trim();
      if (t !== (v.hinweis || '')) protokoll(v, ich, t ? `Hinweis gesetzt: ${t}` : 'Hinweis entfernt');
      v.hinweis = t; formular = null; render(); break; }
    case 'hinweis-weg': v.hinweis = ''; protokoll(v, ich, 'Hinweis entfernt'); formular = null; render(); break;
    case 'vg-entfernen': {
      const vorher = structuredClone({ s: v.schritte, l: v.verlauf });
      const t = v.schritte[i].t;
      entfernen(v, i); protokoll(v, ich, `Schritt ${i + 1} von Hand entfernt: ${t}`);
      formular = null; render();
      toast(`Schritt ${i + 1} entfernt, nur in diesem Vorgang.`, () => { v.schritte = vorher.s; v.verlauf = vorher.l; render(); });
      break; }
    case 'vg-neu-form': formular = { i: -1, art: 'neu' }; formFehler = ''; render(); break;
    case 'vg-neu': {
      const n = leseNeu(); if (!n) { render(); return; }
      const frei = n.wartet == null || fertigOderWeg(v.schritte[n.wartet]);
      v.schritte.push({ ...S(n.t, n.b, n.frist, { wartet: n.wartet, manuell: true }), status: 'offen', zust: null,
        fristDat: frei ? plus(HEUTE, n.frist) : null, erledigtAm: null, erledigtVon: null, wv: null, wert: '', notiz: null });
      protokoll(v, ich, `Schritt ${v.schritte.length} von Hand hinzugefügt: ${n.t} (Pool ${BEREICHE[n.b]})`);
      formular = null; render(); toast(`Schritt ${v.schritte.length} hinzugefügt, liegt ${frei ? 'jetzt' : 'später'} im Pool ${BEREICHE[n.b]}.`); break; }
    /* Anpassungen beim Anlegen */
    case 'e-entfernen': entwurf.schritte[i].entfernt = true; renderVorschau(); break;
    case 'e-zurueck': entwurf.schritte[i].entfernt = false; renderVorschau(); break;
    case 'e-neu-form': entwurf.neuForm = true; formFehler = ''; renderVorschau(); break;
    case 'e-neu-abbrechen': entwurf.neuForm = false; formFehler = ''; renderVorschau(); break;
    case 'e-neu': {
      const n = leseNeu(); if (!n) { renderVorschau(); return; }
      entwurf.schritte.push({ ...S(n.t, n.b, n.frist, { wartet: n.wartet, manuell: true }), entfernt: false });
      entwurf.neuForm = false; renderVorschau(); break; }
    /* Vorgangstypen */
    case 'vt-neu': {
      const id = 'typ' + (++typZaehler);
      VORLAGEN.push({ id, name: 'Neuer Vorgangstyp', beschr: '', stand: 1, aktiv: true, schritte: [S('Erster Schritt', 'vertrieb', 3)] });
      aktVorlage = id; render(); const f = $('#vt-name'); f?.focus(); f?.select(); break; }
    case 'vt-kopie': {
      const q = vorlage(aktVorlage), id = 'typ' + (++typZaehler);
      VORLAGEN.push({ ...structuredClone(q), id, name: q.name + ' (Kopie)', stand: 1, aktiv: true });
      aktVorlage = id; render(); toast(`Kopie von „${q.name}" angelegt. Jetzt umbenennen und anpassen.`); break; }
    case 'vt-aktiv': {
      const vl = vorlage(aktVorlage);
      if (vl.aktiv && VORLAGEN.filter(x => x.aktiv).length === 1) { toast('Mindestens ein Vorgangstyp muss aktiv bleiben.'); break; }
      vl.aktiv = !vl.aktiv;
      const laufend = VORGAENGE.filter(x => x.typ === vl.id && vStatus(x) !== 'fertig').length;
      toast(vl.aktiv ? `„${vl.name}" steht wieder zur Auswahl.`
        : `„${vl.name}" ist deaktiviert und für neue Vorgänge nicht mehr wählbar. ${laufend === 1 ? '1 laufender Vorgang bleibt' : `${laufend} laufende Vorgänge bleiben`} unverändert.`);
      render(); break; }
    case 'v-neu': vorlage(aktVorlage).schritte.push(S('Neuer Schritt', 'vertrieb', 3)); render(); break;
    case 'v-entfernen': {
      const vl = vorlage(aktVorlage); vl.schritte.splice(i, 1);
      vl.schritte.forEach(s => { if (s.wartet === i) s.wartet = null; else if (s.wartet > i) s.wartet--; });
      render(); break; }
    case 'v-speichern': {
      const vl = vorlage(aktVorlage); vl.stand++;
      toast(`„${vl.name}" als Stand ${vl.stand} gespeichert. Gilt für neue Vorgänge, laufende behalten ihre Schritte.`); render(); break; }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches('tr[data-vorgang]')) zeige('vorgang', Number(ev.target.dataset.vorgang));
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'ich') { ich = t.value; formular = null; render(); return; }
  if (t.id === 'nurich') { fNurIch = t.checked; render(); return; }
  if (t.id === 'fertig') { fFertig = t.checked; render(); return; }
  if (t.name === 'a-typ') { entwurf.vorlage = t.value; bedDefaults(); entwurfSchritte(); renderAnlegen(); return; }
  if (t.id === 'vt-name') { const vl = vorlage(aktVorlage); vl.name = t.value.trim() || vl.name; render(); return; }
  if (t.id === 'vt-beschr') { vorlage(aktVorlage).beschr = t.value.trim(); return; }
  if (t.dataset.bed !== undefined) { entwurf.bed[t.dataset.bed] = t.checked; renderVorschau(); return; }
  if (t.id === 'a-start') { entwurf.start = t.value; renderVorschau(); return; }
  if (t.dataset.feld) {
    const s = vorlage(aktVorlage).schritte[Number(t.dataset.i)], f = t.dataset.feld;
    s[f] = f === 'frist' ? Math.max(0, Number(t.value) || 0) : f === 'wartet' ? (t.value === '' ? null : Number(t.value)) : t.value;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'a-kunde') entwurf.kunde = t.value;
  if (t.id === 'a-odoo') entwurf.odoo = t.value;
  if (t.id === 'a-hinweis') entwurf.hinweis = t.value;
});

/* Start: Ansicht aus dem Link (#uebersicht, #vorlagen, #anlegen, #vorgang-1) */
(function start() {
  const h = (location.hash || '').slice(1);
  const m = /^vorgang-(\d+)$/.exec(h);
  if (m && VORGAENGE.some(v => v.id === Number(m[1]))) { ansicht = 'vorgang'; aktId = Number(m[1]); }
  else if (h === 'vorlagen') ansicht = 'vorlagen';
  else if (h === 'anlegen') { neuerEntwurf(VORSCHLAEGE[0]); ansicht = 'anlegen'; }
  render();
})();
</script>
