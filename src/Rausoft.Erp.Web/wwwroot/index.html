<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kundenzentrale · rausoft</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div class="app-laedt">Kundenzentrale wird geladen …</div>
    </div>

    <div id="blazor-error-ui">
        Ein unerwarteter Fehler ist aufgetreten.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Darstellungsmodus: gewählten Modus vor dem ersten Rendern anwenden (kein Aufblitzen)
        (function () {
            var modus = null;
            try { modus = localStorage.getItem('theme'); } catch (e) { }
            if (modus === 'light' || modus === 'dark') document.documentElement.dataset.theme = modus;
        })();
        window.themaSetzen = function (modus) {
            try {
                if (modus) localStorage.setItem('theme', modus); else localStorage.removeItem('theme');
            } catch (e) { }
            if (modus) document.documentElement.dataset.theme = modus;
            else delete document.documentElement.dataset.theme;
        };
        window.themaLesen = function () {
            try { return localStorage.getItem('theme'); } catch (e) { return null; }
        };
        // Dokument-Vorschau: erzeugt eine Blob-URL aus geladenen Dateibytes,
        // damit die Datei im iframe angezeigt werden kann (UNC-Pfade kann der
        // Browser nicht öffnen; der Abruf läuft über die API).
        // Zwischenablage: navigator.clipboard braucht einen Secure Context —
        // im Intranet-Betrieb über http greift der execCommand-Fallback.
        window.zwischenablage = {
            kopieren: async function (text) {
                try { await navigator.clipboard.writeText(text); return true; } catch (e) { }
                const feld = document.createElement('textarea');
                feld.value = text; feld.style.position = 'fixed'; feld.style.opacity = '0';
                document.body.appendChild(feld); feld.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { }
                feld.remove();
                return ok;
            },
            // Letzter Ausweg, wenn der Browser das Kopieren blockiert:
            // Dialog mit vormarkiertem Pfad — Strg+C genügt.
            anzeigen: function (text) {
                window.prompt('Kopieren blockiert — Pfad markieren und Strg+C drücken:', text);
            }
        };
        window.dateiVorschau = {
            erzeugeUrl: (base64, typ) => {
                const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                return URL.createObjectURL(new Blob([bytes], { type: typ }));
            },
            freigeben: (url) => URL.revokeObjectURL(url)
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
